name: CI

on:
  push:
    branches: [master, refactor/stt-diarization-service]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Maven tests and package both services
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate Java API docs
        run: mvn --batch-mode --no-transfer-progress -pl stt-service,analytics-service -am package javadoc:javadoc

      - name: Browser JavaScript tests
        run: node --test stt-service/src/test/js/*.test.cjs

      - name: Whisper HTTP tests with fake backend
        run: python -m unittest discover -s stt-service/whisper -p 'test_*.py' -v

      - name: FRIDA helper tests with fake backend
        run: python -m unittest discover -s analytics-service/judge -p 'test_*.py' -v

      - name: Validate HTTP contracts
        run: npx --yes @redocly/cli@1.34.2 lint docs/api/stt.openapi.yaml docs/api/analytics.openapi.yaml docs/api/whisper-helper.openapi.yaml docs/api/frida-helper.openapi.yaml
