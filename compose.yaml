services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-store:
    image: chrislusf/seaweedfs:4.05
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - object-data:/data
    ports:
      - "127.0.0.1:8333:8333"
  analytics:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    environment:
      ANALYTICS_BIND_ADDRESS: 0.0.0.0
      ARCHIVE_DATABASE_URL: jdbc:postgresql://postgres:5432/interview
      ARCHIVE_DATABASE_USER: interview
      ARCHIVE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INTERVIEW_EVENTS_TOKEN: ${INTERVIEW_EVENTS_TOKEN:?Set INTERVIEW_EVENTS_TOKEN}
      JUDGE_ENABLED: "false"
      REPORTS_DIR: /data/reports
      ARCHIVE_ENABLED: "true"
      ARCHIVE_QUEUE_DIR: /data/reports/queue
      ARCHIVE_S3_ENDPOINT: http://object-store:8333
      ARCHIVE_S3_BUCKET: interviews
      ARCHIVE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ARCHIVE_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ARCHIVE_RETENTION_AUDIO_DAYS: ${ARCHIVE_RETENTION_AUDIO_DAYS:--1}
      ARCHIVE_RETENTION_REPORT_DAYS: ${ARCHIVE_RETENTION_REPORT_DAYS:--1}
    volumes:
      - report-data:/data/reports
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  object-data:
  report-data:
