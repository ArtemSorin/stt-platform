services:
  stt-service:
    build:
      context: .
      dockerfile: stt-service/Dockerfile
    environment:
      STT_BIND_ADDRESS: 0.0.0.0
      ARCHIVE_CONTAINER_BINDING: "true"
      ANALYTICS_URL: http://analytics:8083
      WHISPER_URL: http://whisper:9000
      INTERVIEW_EVENTS_TOKEN: ${INTERVIEW_EVENTS_TOKEN:?Set INTERVIEW_EVENTS_TOKEN}
      ARCHIVE_ENABLED: "true"
      FINALIZATION_WORKER_ENABLED: "true"
      ARCHIVE_QUEUE_DIR: /data/queue
      ARCHIVE_S3_ENDPOINT: http://object-store:8333
      ARCHIVE_S3_BUCKET: interviews
      ARCHIVE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ARCHIVE_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      GATEWAY_OUTPUT: /data/runs
      GATEWAY_AUDIO_SPOOL_DIR: /data/pcm
      DIARIZATION_OUTPUT: /data/diarization
    volumes:
      - stt-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      whisper:
        condition: service_healthy
      analytics:
        condition: service_started
      object-store:
        condition: service_started
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-store:
    image: chrislusf/seaweedfs:4.05
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - object-data:/data
  analytics:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    environment:
      ANALYTICS_BIND_ADDRESS: 0.0.0.0
      ARCHIVE_DATABASE_URL: jdbc:postgresql://postgres:5432/interview
      ARCHIVE_DATABASE_USER: interview
      ARCHIVE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INTERVIEW_EVENTS_TOKEN: ${INTERVIEW_EVENTS_TOKEN:?Set INTERVIEW_EVENTS_TOKEN}
      JUDGE_ENABLED: ${JUDGE_ENABLED:-true}
      JUDGE_URL: http://frida:9100
      REPORTS_DIR: /data/reports
      ARCHIVE_ENABLED: "true"
      FINALIZATION_WORKER_ENABLED: "true"
      ARCHIVE_QUEUE_DIR: /data/reports/queue
      ARCHIVE_S3_ENDPOINT: http://object-store:8333
      ARCHIVE_S3_BUCKET: interviews
      ARCHIVE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ARCHIVE_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ARCHIVE_RETENTION_AUDIO_DAYS: ${ARCHIVE_RETENTION_AUDIO_DAYS:--1}
      ARCHIVE_RETENTION_REPORT_DAYS: ${ARCHIVE_RETENTION_REPORT_DAYS:--1}
    volumes:
      - report-data:/data/reports
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      frida:
        condition: service_healthy
  whisper:
    build:
      context: .
      dockerfile: stt-service/whisper/Dockerfile
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
    volumes:
      - whisper-models:/models
  finalization-worker:
    build:
      context: .
      dockerfile: finalization-worker/Dockerfile
    environment:
      WORKER_ANALYTICS_URL: http://analytics:8083
      INTERVIEW_EVENTS_TOKEN: ${INTERVIEW_EVENTS_TOKEN:?Set INTERVIEW_EVENTS_TOKEN}
      ARCHIVE_S3_ENDPOINT: http://object-store:8333
      ARCHIVE_S3_BUCKET: interviews
      ARCHIVE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ARCHIVE_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      WHISPER_URL: http://whisper:9000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8090'"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      analytics:
        condition: service_started
      object-store:
        condition: service_started
      whisper:
        condition: service_healthy
  frida:
    build:
      context: .
      dockerfile: analytics-service/judge/Dockerfile
      args:
        FRIDA_BACKEND: ${FRIDA_BACKEND:-onnx}
    environment:
      JUDGE_THREADS: ${JUDGE_THREADS:-}
    volumes:
      - frida-models:/models
volumes:
  stt-data:
  postgres-data:
  object-data:
  report-data:
  whisper-models:
  frida-models:
